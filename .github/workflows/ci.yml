name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Trust HTTPS developer certificate
        run: |
          if ! dotnet dev-certs https --trust; then
            test -n "$(find "$HOME/.aspnet/dev-certs/trust" -type f -print -quit)"
          fi
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore CarparkAvailability.slnx

      - name: Validate OpenAPI contracts and generate clients
        run: |
          dotnet msbuild src/CarparkAvailability.ApiApp/CarparkAvailability.ApiApp.csproj \
            -target:GenerateDataGovSgApiClient \
            -property:Configuration=Release \
            -property:TargetFramework=net10.0
          dotnet msbuild src/CarparkAvailability.WebApp/CarparkAvailability.WebApp.csproj \
            -target:GenerateCarparkApiClient \
            -property:Configuration=Release \
            -property:TargetFramework=net10.0

      - name: Build Release
        run: dotnet build CarparkAvailability.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test CarparkAvailability.slnx --no-build --configuration Release --verbosity normal
